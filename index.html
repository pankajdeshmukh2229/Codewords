<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Game of Words</title>
<style>
:root{color-scheme:dark;--bg:#101218;--panel:#191c25;--line:#2a2f3d;--ink:#f2f4f8;--dim:#a1a8b7;--t1:#f0a500;--t2:#3fa9dd;--assassin:#d64545;--neutral:#828a98}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}button,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.65rem .9rem}button{cursor:pointer}button:hover,select:hover{border-color:var(--t2)}button:focus-visible,select:focus-visible{outline:3px solid var(--t2);outline-offset:2px}[hidden]{display:none!important}.overlay{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.5rem;padding:1.5rem;background:#080a0ef2;text-align:center}.overlay h1{font-size:clamp(2rem,6vw,4rem);font-weight:300;letter-spacing:.14em;text-transform:uppercase;margin:0}.overlay p{max-width:38rem;color:var(--dim)}.choices{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}.choice{min-width:13rem;padding:1.4rem 1.8rem;font-weight:700;font-size:1.15rem}.choice small{display:block;color:var(--dim);font-size:.82rem;font-weight:400;margin-top:.4rem}.app{height:100%;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:1rem;padding:.65rem 1rem;border-bottom:1px solid var(--line)}.team{display:flex;align-items:baseline;gap:.65rem;padding:.25rem .7rem;border:1px solid transparent;border-radius:8px;min-width:8rem}.team .label{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}.score{font-size:clamp(1.6rem,4vh,2.7rem);font-weight:750;font-variant-numeric:tabular-nums}.t1 .score{color:var(--t1)}.t2 .score{color:var(--t2)}#team2{margin-left:auto;justify-content:flex-end}.team.won{border-color:currentColor}.mid{flex:1;text-align:center;min-width:0}#status{font-size:clamp(.85rem,2vh,1.15rem);color:var(--dim)}#status.alert{color:#ff7373;font-weight:700}#target{font-size:.72rem;color:var(--dim);letter-spacing:.08em}main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:clamp(4px,1vw,10px);padding:clamp(5px,1.2vw,12px)}.cell{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:.3rem;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);text-align:center;font-size:clamp(.78rem,min(2.5vw,4.7vh),2.5rem);font-weight:650;line-height:1.12;overflow-wrap:anywhere;user-select:none}.word{display:block}.len-m .word{font-size:.82em}.len-l .word{font-size:.66em}.len-xl .word{font-size:.52em}.moderator .cell{cursor:pointer}.moderator .cell:not(.revealed):hover{transform:translateY(-2px);border-color:#fff}.moderator .cell.k-t1{background:#4a3a10;border-color:var(--t1);color:#ffdf9a}.moderator .cell.k-t2{background:#12384d;border-color:var(--t2);color:#bfe6fb}.moderator .cell.k-a{background:#4d1717;border-color:var(--assassin);color:#ffc7c7}.moderator .cell.k-n{background:#23262f;color:#c3c8d2}.cell.revealed{font-weight:750}.cell.revealed.k-t1{background:var(--t1);color:#221900}.cell.revealed.k-t2{background:var(--t2);color:#04202e}.cell.revealed.k-a{background:var(--assassin);color:#2a0505}.cell.revealed.k-n{background:var(--neutral);color:#15181d}.moderator .cell.revealed{opacity:.55}.cell.revealed .word{text-decoration:line-through;text-decoration-thickness:2px}.tag{position:absolute;top:.25rem;left:.35rem;font-size:.55rem;letter-spacing:.08em;text-transform:uppercase}.player .tag{display:none}footer{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;padding:.6rem 1rem;border-top:1px solid var(--line)}footer label,.hint{font-size:.75rem;color:var(--dim)}select{min-width:12rem}.primary{background:var(--t2);border-color:var(--t2);color:#04202e;font-weight:750}.spacer{flex:1}.modalbox{max-width:34rem;padding:2rem;border:1px solid var(--assassin);border-radius:14px;background:var(--panel)}.modalbox h2{color:#ff7373;letter-spacing:.12em;text-transform:uppercase}.modalbox p{color:var(--dim)}.team-pick{min-width:8rem}.team-pick:first-child{border-color:var(--t1);color:var(--t1)}.team-pick:last-child{border-color:var(--t2);color:var(--t2)}@media(max-width:600px){header{gap:.3rem;padding:.4rem}.team{min-width:0;gap:.35rem;padding:.2rem}.team .label{font-size:.58rem}.score{font-size:1.35rem}#status{font-size:.78rem}footer{padding:.4rem;gap:.35rem}footer button,footer select{padding:.5rem;font-size:.78rem}select{min-width:8rem}.hint{font-size:.65rem}}

<body class="player">
<section id="chooser" class="overlay">
  <h1>Game of Words</h1>
  <p>Open this page as a moderator and on a second screen as a player. The player board follows the moderator on the same browser and device.</p>
  <div class="choices"><button class="choice" data-role="moderator">Moderator<small>See the key · reveal and score words</small></button><button class="choice" data-role="player">Player<small>Words only · display on the big screen</small></button></div>
</section>
<div id="app" class="app" hidden>
  <header>
    <div id="team1" class="team t1"><span class="label">Team 1</span><span id="s1" class="score">0</span></div>
    <div class="mid"><div id="status" aria-live="polite">&nbsp;</div><div id="target"></div></div>
    <div id="team2" class="team t2"><span class="label">Team 2</span><span id="s2" class="score">0</span></div>
  </header>
  <main id="grid" aria-label="Game board"></main>
  <footer id="controls" hidden>
    <label for="listSel">Word list</label><select id="listSel"></select>
    <button class="primary" id="newGame">New game</button><button id="openPlayer">Open player screen</button>
    <span class="spacer"></span><span id="remaining" class="hint"></span>
  </footer>
</div>
<section id="assassinModal" class="overlay" hidden>
  <div class="modalbox"><h2>Assassin</h2><p>Which team is playing? That team loses 20 points and the winning target drops to 80.</p><div class="choices"><button class="team-pick" data-team="1">Team 1</button><button class="team-pick" data-team="2">Team 2</button></div></div>
</section>
<script>
'use strict';
const LISTS={

  'Animals':['Elephant','Tiger','Dolphin','Penguin','Giraffe','Kangaroo','Octopus','Falcon','Panda','Rhino','Cheetah','Walrus','Otter','Beaver','Hedgehog','Flamingo','Peacock','Crocodile','Tortoise','Chameleon','Squirrel','Raccoon','Buffalo','Camel','Leopard','Jaguar','Gorilla','Chimpanzee','Koala','Platypus','Armadillo','Porcupine','Ferret','Weasel','Badger','Moose','Reindeer','Antelope','Zebra','Hippo','Lobster','Jellyfish','Seahorse','Stingray','Barracuda','Piranha','Salmon','Trout','Anchovy','Swordfish','Vulture','Pelican','Ostrich','Woodpecker','Hummingbird','Sparrow','Magpie','Nightingale','Cuckoo','Pigeon','Parrot','Canary','Owl','Eagle','Hawk','Swan','Duckling','Rooster','Donkey','Llama','Alpaca','Bison','Lynx','Mongoose','Meerkat','Wombat','Dingo','Hyena','Jackal','Panther','Cobra','Python','Viper','Gecko','Iguana','Newt','Salamander','Toad','Snail','Scorpion','Tarantula','Beetle','Dragonfly','Butterfly','Grasshopper','Cricket','Termite','Caterpillar','Mantis','Firefly'],
  'Food and Drink':['Pizza','Noodle','Pancake','Waffle','Omelette','Sandwich','Burger','Taco','Burrito','Dumpling','Sushi','Risotto','Lasagne','Curry','Biryani','Samosa','Falafel','Hummus','Guacamole','Salsa','Pesto','Mustard','Ketchup','Vinegar','Cinnamon','Nutmeg','Paprika','Saffron','Turmeric','Ginger','Garlic','Chilli','Pepper','Basil','Parsley','Coriander','Rosemary','Oregano','Almond','Cashew','Walnut','Pistachio','Hazelnut','Coconut','Mango','Papaya','Pineapple','Avocado','Blueberry','Raspberry','Cranberry','Pomegranate','Apricot','Nectarine','Watermelon','Pumpkin','Zucchini','Aubergine','Broccoli','Cauliflower','Asparagus','Artichoke','Spinach','Lettuce','Cucumber','Radish','Beetroot','Turnip','Parsnip','Lentil','Chickpea','Quinoa','Barley','Oatmeal','Pastry','Croissant','Baguette','Pretzel','Doughnut','Brownie','Cheesecake','Custard','Pudding','Sorbet','Caramel','Toffee','Marshmallow','Chocolate','Espresso','Cappuccino','Smoothie','Lemonade','Cider','Yoghurt','Cheddar','Mozzarella','Parmesan'],
  'Technology':['Keyboard','Monitor','Router','Firewall','Database','Server','Laptop','Tablet','Printer','Scanner','Webcam','Microphone','Speaker','Processor','Memory','Storage','Backup','Password','Encryption','Algorithm','Software','Hardware','Network','Bandwidth','Download','Upload','Browser','Website','Domain','Protocol','Interface','Terminal','Compiler','Debugger','Repository','Version','Deployment','Container','Cluster','Cloud','Satellite','Antenna','Bluetooth','Wireless','Charger','Battery','Circuit','Transistor','Semiconductor','Robot','Drone','Sensor','Automation','Simulation','Analytics','Dashboard','Spreadsheet','Presentation','Document','Folder','Shortcut','Clipboard','Cursor','Scrollbar','Toolbar','Notification','Subscription','Streaming','Podcast','Bookmark','Hyperlink','Emoji','Avatar','Profile','Timeline','Messaging','Videocall','Headset','Projector','Whiteboard','Barcode','Hologram','Biometric','Fingerprint','Blockchain','Cryptocurrency','Firmware','Kernel','Cache','Bugfix','Patch','Prototype','Blueprint','Gadget','Widget','Console','Joystick','Bitrate','Codec'],
  'Sports and Games':['Cricket','Football','Tennis','Badminton','Hockey','Basketball','Volleyball','Baseball','Rugby','Golf','Boxing','Wrestling','Archery','Fencing','Cycling','Swimming','Diving','Rowing','Sailing','Surfing','Skating','Skiing','Snowboard','Marathon','Sprint','Hurdles','Javelin','Discus','Shotput','Gymnastics','Trampoline','Weightlifting','Karate','Judo','Taekwondo','Kickboxing','Chess','Checkers','Backgammon','Dominoes','Scrabble','Monopoly','Sudoku','Crossword','Jigsaw','Bingo','Darts','Snooker','Billiards','Bowling','Curling','Polo','Squash','Handball','Netball','Softball','Lacrosse','Triathlon','Decathlon','Pentathlon','Referee','Umpire','Stadium','Dugout','Bleachers','Scoreboard','Trophy','Medal','Podium','Championship','Tournament','Playoff','Penalty','Offside','Foul','Tackle','Dribble','Volley','Backhand','Forehand','Serve','Rally','Innings','Wicket','Bowler','Batsman','Fielder','Goalkeeper','Striker','Midfield','Defender','Coach','Captain','Substitute','Timeout','Halftime','Overtime','Whistle','Jersey','Helmet'],
  'Movies and TV':['Director','Producer','Screenplay','Storyboard','Rehearsal','Audition','Casting','Costume','Makeup','Lighting','Camera','Closeup','Montage','Flashback','Sequel','Prequel','Trilogy','Blockbuster','Premiere','Boxoffice','Trailer','Teaser','Soundtrack','Subtitle','Dubbing','Animation','Documentary','Thriller','Comedy','Romance','Western','Musical','Sitcom','Miniseries','Episode','Season','Finale','Cliffhanger','Spinoff','Reboot','Cameo','Stuntman','Protagonist','Villain','Sidekick','Narrator','Dialogue','Monologue','Scene','Backdrop','Wardrobe','Greenroom','Studio','Backlot','Cinema','Multiplex','Popcorn','Intermission','Matinee','Critic','Review','Rating','Award','Nomination','Oscar','Grammy','Emmy','Festival','Redcarpet','Paparazzi','Celebrity','Fandom','Binge','Streaming','Channel','Broadcast','Newsreader','Anchor','Weatherman','Gameshow','Quizmaster','Contestant','Reality','Talkshow','Interview','Sketch','Standup','Puppet','Cartoon','Superhero','Detective','Spy','Heist','Chase','Suspense','Twist','Ending']
};
const STORE_KEY='gow.state.v1', COMPOSITION=[...'t1'.repeat(0)];
const COUNTS={t1:10,t2:10,a:1,n:4}, POINTS=10, PENALTY=20;
let role='player',state=null,pending=-1;
function shuffle(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickWords(words){const pool=shuffle([...new Set(words.map(w=>w.trim()).filter(Boolean))]);if(pool.length<25)throw Error('Each word list needs at least 25 unique words.');return pool.slice(0,25)}
function newState(index){const names=Object.keys(LISTS),owners=[];Object.entries(COUNTS).forEach(([kind,count])=>{for(let i=0;i<count;i++)owners.push(kind)});return{listIndex:index,listName:names[index],words:pickWords(LISTS[names[index]]),owners:shuffle(owners),revealed:Array(25).fill(false),s1:0,s2:0,won1:false,won2:false,target:100,message:'',stamp:Date.now()}}
function save(){state.stamp=Date.now();try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){statusMessage('Could not save game state in this browser.')}render()}
function statusMessage(text){const el=document.getElementById('status');if(el)el.textContent=text}
function valid(s){return s&&Array.isArray(s.words)&&s.words.length===25&&Array.isArray(s.owners)&&s.owners.length===25&&Array.isArray(s.revealed)&&s.revealed.length===25}
function load(){try{const s=JSON.parse(localStorage.getItem(STORE_KEY));if(!valid(s))return false;state=s;return true}catch(e){return false}}
function locked(){return !!(state&&(state.won1||state.won2||state.revealed.some(Boolean)))}
function award(team,points){const key=team===1?'s1':'s2',won=team===1?'won1':'won2';if(!state[won]){state[key]+=points;if(state[key]>=state.target)state[won]=true}}
function reveal(i,team){if(!state||state.revealed[i]||state.won1||state.won2)return;const owner=state.owners[i];if(owner==='a'&&team==null){pending=i;document.getElementById('assassinModal').hidden=false;return}state.revealed[i]=true;if(owner==='t1'){award(1,POINTS);state.message=''}else if(owner==='t2'){award(2,POINTS);state.message=''}else if(owner==='n'){state.message='Neutral word — no score.'}else{if(team===1)state.s1-=PENALTY;else state.s2-=PENALTY;state.target=80;state.message=`Assassin hit by Team ${team}. Minus ${PENALTY}. Target is now ${state.target}.`;if(state.s1>=state.target)state.won1=true;if(state.s2>=state.target)state.won2=true}save()}
function render(){if(!state)return;const grid=document.getElementById('grid');if(grid.children.length!==25){grid.replaceChildren();for(let i=0;i<25;i++){const c=document.createElement('button');c.type='button';c.className='cell';c.dataset.i=i;c.setAttribute('aria-label',`Word ${i+1}`);const tag=document.createElement('span');tag.className='tag';const word=document.createElement('span');word.className='word';c.append(tag,word);grid.append(c)}}const labels={t1:'Team 1',t2:'Team 2',a:'Assassin',n:'Neutral'};for(let i=0;i<25;i++){const c=grid.children[i],owner=state.owners[i],shown=role==='moderator'||state.revealed[i],word=state.words[i];c.className='cell'+(shown?' k-'+owner:'')+(state.revealed[i]?' revealed':'')+(word.length>20?' len-xl':word.length>14?' len-l':word.length>9?' len-m':'');c.querySelector('.word').textContent=word;c.querySelector('.tag').textContent=role==='moderator'?labels[owner]:'';c.disabled=role!=='moderator'||!!(state.won1||state.won2)||state.revealed[i];c.setAttribute('aria-label',role==='moderator'?`${word}, ${labels[owner]}${state.revealed[i]?', revealed':''}`:state.revealed[i]?`${word}, revealed`:`Word ${i+1}`)}document.getElementById('s1').textContent=state.won1?'WON':state.s1;document.getElementById('s2').textContent=state.won2?'WON':state.s2;document.getElementById('team1').classList.toggle('won',state.won1);document.getElementById('team2').classList.toggle('won',state.won2);const status=document.getElementById('status');status.textContent=state.won1||state.won2?(state.won1&&state.won2?'Both teams reached the target.':`Team ${state.won1?'1':'2'} wins.`):state.message||' ';status.className=state.message.startsWith('Assassin')||state.won1||state.won2?'alert':'';document.getElementById('target').textContent=`${state.listName} · target ${state.target}`;if(role==='moderator'){const sel=document.getElementById('listSel');sel.value=String(state.listIndex);sel.disabled=locked();document.getElementById('remaining').textContent=`${state.revealed.filter(r=>!r).length} of 25 words left${locked()&&!state.won1&&!state.won2?' · list locked during play':''}`}}
function start(which){role=which;document.body.className=role;document.getElementById('chooser').hidden=true;document.getElementById('app').hidden=false;document.getElementById('controls').hidden=role!=='moderator';if(role==='moderator'){const sel=document.getElementById('listSel');sel.replaceChildren(...Object.keys(LISTS).map((name,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${name} (${LISTS[name].length} words)`;return o}));if(!load())state=newState(0);sel.value=String(state.listIndex);save()}else{if(!load())state=newState(0);render()}let last=state.stamp;window.addEventListener('storage',e=>{if(e.key===STORE_KEY&&load())render()});setInterval(()=>{try{const s=JSON.parse(localStorage.getItem(STORE_KEY));if(valid(s)&&s.stamp!==last){last=s.stamp;if(role==='player'){state=s;render()}}}catch(e){}},500)}
document.querySelectorAll('#chooser [data-role]').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.role;start(b.dataset.role)}));document.getElementById('grid').addEventListener('click',e=>{if(role!=='moderator')return;const cell=e.target.closest('.cell');if(cell)reveal(Number(cell.dataset.i),null)});document.getElementById('newGame').addEventListener('click',()=>{state=newState(Number(document.getElementById('listSel').value));save()});document.getElementById('listSel').addEventListener('change',function(){if(locked()){render();return}state=newState(Number(this.value));save()});document.getElementById('openPlayer').addEventListener('click',()=>window.open(location.href.split('#')[0]+'#player','gowPlayer'));document.querySelectorAll('#assassinModal [data-team]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('assassinModal').hidden=true;const i=pending;pending=-1;if(i>=0)reveal(i,Number(b.dataset.team))}));const hash=location.hash.slice(1).toLowerCase();if(hash==='moderator'||hash==='player')start(hash);
</script>
